services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3210:3000"
    # Secrets are loaded straight from .env, not interpolated as ${VARS} below —
    # interpolation prefers an already-set shell/session env var of the same
    # name over .env, which silently shadows real secrets with empty values
    # (this bit us via WSLENV passing through an empty OPENAI_API_KEY).
    env_file:
      - .env
    environment:
      DATABASE_URL: "file:/app/data/dev.db"
      SEARXNG_URL: "http://searxng:8080"
    volumes:
      - app-data:/app/data
    depends_on:
      - searxng

  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
    volumes:
      - ./searxng:/etc/searxng:ro
      - searxng-data:/var/cache/searxng
    ports:
      - "8080:8080"

volumes:
  app-data:
  searxng-data:
